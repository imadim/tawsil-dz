{% extends "base.html" %}

{% block title %}تعديل {{ menu_item.name_ar }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">
                    <i class="fas fa-edit"></i> تعديل الطبق
                </h4>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <!-- Current Image -->
                    {% if menu_item.image_url %}
                    <div class="mb-3">
                        <label class="form-label">الصورة الحالية:</label>
                        <div>
                            <img src="{{ menu_item.image_url }}" class="img-fluid rounded" 
                                 style="max-height: 200px;">
                        </div>
                    </div>
                    {% endif %}
                    
                    <!-- New Image -->
                    <div class="mb-4">
                        <label class="form-label">
                            <i class="fas fa-image"></i> صورة جديدة (اختياري)
                        </label>
                        <input type="file" class="form-control" name="image" 
                               accept="image/*" id="imageInput">
                        
                        <div id="imagePreview" class="mt-3" style="display: none;">
                            <img id="previewImg" src="" class="img-fluid rounded" 
                                 style="max-height: 300px;">
                        </div>
                    </div>
                    
                    <!-- Name -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-utensils"></i> اسم الطبق *
                        </label>
                        <input type="text" class="form-control" name="name_ar" 
                               value="{{ menu_item.name_ar }}" required>
                    </div>
                    
                    <!-- Description -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-align-left"></i> الوصف
                        </label>
                        <textarea class="form-control" name="description_ar" rows="3">{{ menu_item.description_ar or '' }}</textarea>
                    </div>
                    
                    <!-- Price -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-tag"></i> السعر (د.ج) *
                        </label>
                        <input type="number" class="form-control" name="price" 
                               step="0.01" min="0" value="{{ menu_item.price }}" required>
                    </div>
                    
                    <!-- Category -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-list"></i> التصنيف *
                        </label>
                        <select class="form-select" name="category_ar" required>
                            <option value="">اختار التصنيف...</option>
                            {% for cat in ['مقبلات', 'شوربة', 'أطباق رئيسية', 'معكرونة', 'بيتزا', 'برغر', 'ساندويتشات', 'سلطات', 'حلويات', 'مشروبات', 'أخرى'] %}
                            <option value="{{ cat }}" {{ 'selected' if menu_item.category_ar == cat else '' }}>
                                {{ cat }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <!-- Preparation Time -->
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-clock"></i> وقت التحضير (دقيقة)
                        </label>
                        <input type="number" class="form-control" name="preparation_time" 
                               min="5" value="{{ menu_item.preparation_time }}">
                    </div>
                    
                    <!-- Availability -->
                    <div class="mb-3">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" name="is_available" 
                                   id="availableSwitch" {{ 'checked' if menu_item.is_available else '' }}>
                            <label class="form-check-label" for="availableSwitch">
                                متاح للطلب
                            </label>
                        </div>
                    </div>
                    
                    <!-- Buttons -->
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">
                            <i class="fas fa-save"></i> حفظ التعديلات
                        </button>
                        <a href="{{ url_for('restaurant_menu_management') }}" 
                           class="btn btn-secondary">
                            <i class="fas fa-arrow-right"></i> رجوع
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('imageInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('previewImg').src = e.target.result;
            document.getElementById('imagePreview').style.display = 'block';
        };
        reader.readAsDataURL(file);
    }
});
</script>
{% endblock %}
