<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار التتبع الكامل</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            padding: 15px;
        }

        h2 {
            text-align: center;
            color: #1565C0;
            margin-bottom: 15px;
            font-size: 20px;
        }

        #map {
            height: 480px;
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* ── MARKER STYLES ── */
        .custom-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .marker-circle {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 3px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.35);
        }
        .marker-circle i { font-size: 20px; color: white; }
        .marker-label {
            margin-top: 4px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            color: white;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            text-align: center;
        }
        .circle-driver     { background: #1565C0; }
        .circle-restaurant { background: #c62828; }
        .circle-delivery   { background: #2e7d32; }
        .label-driver      { background: #1565C0; }
        .label-restaurant  { background: #c62828; }
        .label-delivery    { background: #2e7d32; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-6px); }
        }
        .circle-driver { animation: bounce 1s infinite; }

        .leaflet-routing-container { display: none !important; }

        /* ── PHASE BANNER ── */
        .phase-banner {
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            margin: 10px 0;
            transition: all 0.4s ease;
        }
        .phase-to-restaurant {
            background: #fff3e0;
            color: #e65100;
            border: 2px solid #ff9800;
        }
        .phase-to-client {
            background: #e8f5e9;
            color: #1b5e20;
            border: 2px solid #4CAF50;
        }
        .phase-done {
            background: #e3f2fd;
            color: #0d47a1;
            border: 2px solid #2196F3;
        }

        /* ── PROGRESS BAR ── */
        .progress-wrap {
            background: #ddd;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .progress-phase1 {
            background: linear-gradient(90deg, #ff9800, #e65100);
        }
        .progress-phase2 {
            background: linear-gradient(90deg, #2196F3, #4CAF50);
        }

        /* ── STATS ROW ── */
        .stats-row {
            display: flex;
            gap: 10px;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .stat-box {
            flex: 1;
            min-width: 80px;
            background: white;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .stat-box i    { font-size: 20px; display: block; margin-bottom: 4px; }
        .stat-box strong { font-size: 15px; display: block; color: #333; }
        .stat-box small  { color: #888; font-size: 11px; }

        /* ── PHASE STEPS UI ── */
        .steps-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin: 10px 0;
        }
        .step-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 16px;
            border-radius: 12px;
            background: #eee;
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.4s;
            min-width: 90px;
            text-align: center;
        }
        .step-box i { font-size: 20px; margin-bottom: 4px; }
        .step-box.active {
            background: #fff3e0;
            color: #e65100;
            box-shadow: 0 2px 8px rgba(230,81,0,0.3);
        }
        .step-box.done {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .step-arrow {
            color: #ccc;
            font-size: 20px;
            margin: 0 5px;
        }
        .step-arrow.active { color: #ff9800; }
        .step-arrow.done   { color: #4CAF50; }

        /* ── BUTTONS ── */
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .btn {
            flex: 1;
            min-width: 100px;
            border: none;
            border-radius: 10px;
            padding: 12px 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }
        .btn:hover    { opacity: 0.85; }
        .btn-start    { background: #2196F3; }
        .btn-pickup   { background: #ff9800; }
        .btn-reset    { background: #9e9e9e; }
        .btn-stop     { background: #f44336; }

        /* ── LOG BOX ── */
        .log-box {
            background: #1e1e1e;
            color: #00e676;
            border-radius: 10px;
            padding: 12px;
            font-size: 12px;
            font-family: monospace;
            height: 120px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .log-box p { margin: 2px 0; }
        .log-orange { color: #ffab40; }
        .log-green  { color: #69f0ae; }
        .log-blue   { color: #40c4ff; }
        .log-red    { color: #ff5252; }
    </style>
</head>
<body>

<h2>🗺️ اختبار التتبع الكامل – مطعم ← سائق ← عميل</h2>

<!-- Phase Steps UI -->
<div class="steps-row">
    <div class="step-box active" id="step1">
        <i class="fas fa-motorcycle"></i>
        السائق
    </div>
    <div class="step-arrow active" id="arrow1">→</div>
    <div class="step-box active" id="step2">
        <i class="fas fa-store"></i>
        المطعم
    </div>
    <div class="step-arrow" id="arrow2">→</div>
    <div class="step-box" id="step3">
        <i class="fas fa-home"></i>
        العميل
    </div>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Phase Banner -->
<div class="phase-banner phase-to-restaurant" id="phaseBanner">
    🏍️ المرحلة 1 – السائق في طريقه إلى المطعم لاستلام الطلب...
</div>

<!-- Progress Bar -->
<div>
    <div style="display:flex;justify-content:space-between;">
        <small style="color:#666;" id="progressLabel">تقدم المرحلة 1</small>
        <small style="color:#666;" id="progressPct">0%</small>
    </div>
    <div class="progress-wrap">
        <div class="progress-fill progress-phase1" id="progressBar"></div>
    </div>
</div>

<!-- Stats -->
<div class="stats-row">
    <div class="stat-box">
        <i class="fas fa-route text-primary" style="color:#2196F3;"></i>
        <strong id="distanceText">-- كم</strong>
        <small>المسافة</small>
    </div>
    <div class="stat-box">
        <i class="fas fa-clock" style="color:#ff9800;"></i>
        <strong id="etaText">-- دقيقة</strong>
        <small>وقت الوصول</small>
    </div>
    <div class="stat-box">
        <i class="fas fa-tachometer-alt" style="color:#4CAF50;"></i>
        <strong id="speedText">-- كم/س</strong>
        <small>السرعة</small>
    </div>
    <div class="stat-box">
        <i class="fas fa-map-pin" style="color:#9c27b0;"></i>
        <strong id="phaseText">المرحلة 1</strong>
        <small>المرحلة</small>
    </div>
</div>

<!-- Buttons -->
<div class="btn-row">
    <button class="btn btn-start"  onclick="startPhase1()">▶️ ابدأ المرحلة 1</button>
    <button class="btn btn-pickup" onclick="manualPickup()" id="btnPickup" disabled>
        📦 استلم الطلب (المرحلة 2)
    </button>
    <button class="btn btn-stop"   onclick="stopSimulation()">⏹️ إيقاف</button>
    <button class="btn btn-reset"  onclick="resetAll()">🔄 إعادة</button>
</div>

<!-- Log -->
<div class="log-box" id="logBox">
    <p class="log-blue">📡 جاهز للاختبار – اضغط "ابدأ المرحلة 1"</p>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script>

// ============================================================
//  TEST DATA – Algiers coordinates
// ============================================================
const TEST = {
    driver: {
        name: 'سائق: أحمد',
        // driver starts far from restaurant
        lat: 36.7520,
        lng: 3.0650
    },
    restaurant: {
        name: 'مطعم الأصيل',
        lat: 36.7372,
        lng: 3.0865
    },
    delivery: {
        name: 'موقع العميل',
        lat: 36.7180,
        lng: 3.1120
    }
};

// ============================================================
//  GLOBALS
// ============================================================
let map, routeControl;
let driverMarker, restaurantMarker, deliveryMarker;
let simulationInterval = null;

// phase 1 = driver → restaurant
// phase 2 = driver → client
let currentPhase   = 1;
let routePoints    = [];    // GPS points along current route
let currentStep    = 0;

// ============================================================
//  LOGGING HELPER
// ============================================================
function log(msg, cls) {
    const box = document.getElementById('logBox');
    const p   = document.createElement('p');
    p.className = cls || '';
    p.textContent = new Date().toLocaleTimeString('ar-DZ') + ' – ' + msg;
    box.appendChild(p);
    box.scrollTop = box.scrollHeight;
}

// ============================================================
//  ICONS
// ============================================================
function makeIcon(faIcon, circleClass, labelClass, labelText) {
    const short = labelText.length > 16
        ? labelText.substring(0, 14) + '…'
        : labelText;
    return L.divIcon({
        className: 'custom-marker',
        html: `
            <div class="marker-circle ${circleClass}">
                <i class="fas ${faIcon}"></i>
            </div>
            <div class="marker-label ${labelClass}">${short}</div>
        `,
        iconSize:    [120, 68],
        iconAnchor:  [60, 46],
        popupAnchor: [0, -50]
    });
}

const ICONS = {
    driver:     () => makeIcon('fa-motorcycle', 'circle-driver',     'label-driver',     TEST.driver.name),
    restaurant: () => makeIcon('fa-store',      'circle-restaurant', 'label-restaurant', TEST.restaurant.name),
    delivery:   () => makeIcon('fa-home',       'circle-delivery',   'label-delivery',   TEST.delivery.name)
};

// ============================================================
//  INIT MAP
// ============================================================
function initMap() {
    map = L.map('map').setView([36.7350, 3.0900], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
    }).addTo(map);

    // ── place all 3 markers ──
    restaurantMarker = L.marker(
        [TEST.restaurant.lat, TEST.restaurant.lng],
        { icon: ICONS.restaurant(), zIndexOffset: 100 }
    ).addTo(map);

    deliveryMarker = L.marker(
        [TEST.delivery.lat, TEST.delivery.lng],
        { icon: ICONS.delivery(), zIndexOffset: 100 }
    ).addTo(map);

    driverMarker = L.marker(
        [TEST.driver.lat, TEST.driver.lng],
        { icon: ICONS.driver(), zIndexOffset: 999 }
    ).addTo(map);

    // fit all 3 in view
    map.fitBounds(L.latLngBounds([
        [TEST.driver.lat,     TEST.driver.lng],
        [TEST.restaurant.lat, TEST.restaurant.lng],
        [TEST.delivery.lat,   TEST.delivery.lng]
    ]), { padding: [50, 50] });

    log('🗺️ الخريطة جاهزة – 3 ماركورات تم رسمها', 'log-blue');

    // draw phase 1 route preview on load
    drawRoute(
        TEST.driver.lat,
        TEST.driver.lng,
        TEST.restaurant.lat,
        TEST.restaurant.lng,
        1,
        false   // isInit = false, don't store points yet
    );
}

// ============================================================
//  DRAW ROUTE  (fromLat/Lng → toLat/Lng)
//  phase:  1 = orange line,  2 = blue line
//  storePoints: true = save coordinates for simulation
// ============================================================
function drawRoute(fromLat, fromLng, toLat, toLng, phase, storePoints) {
    if (routeControl) {
        try { map.removeControl(routeControl); } catch(e) {}
        routeControl = null;
    }

    // line colors per phase
    const glowColor  = phase === 1 ? '#FFCC80' : '#90CAF9';
    const lineColor  = phase === 1 ? '#e65100' : '#1565C0';

    routeControl = L.Routing.control({
        waypoints: [
            L.latLng(fromLat, fromLng),
            L.latLng(toLat,   toLng)
        ],
        router: L.Routing.osrmv1({
            serviceUrl:    'https://router.project-osrm.org/route/v1',
            profile:       'driving',
            timeout:       10000,
            urlParameters: { alternatives: 3 }
        }),
        routeWhileDragging:  false,
        show:                false,
        addWaypoints:        false,
        draggableWaypoints:  false,
        fitSelectedRoutes:   false,
        lineOptions: {
            styles: [
                { color: glowColor, opacity: 0.40, weight: 12 },
                { color: lineColor, opacity: 0.95, weight: 5  }
            ],
            extendToWaypoints:     true,
            missingRouteTolerance: 0
        },
        createMarker: () => null
    }).addTo(map);

    routeControl.on('routesfound', function(e) {
        // pick shortest route
        let best = e.routes[0];
        for (let i = 1; i < e.routes.length; i++) {
            if (e.routes[i].summary.totalDistance < best.summary.totalDistance) {
                best = e.routes[i];
            }
        }

        const distKm = (best.summary.totalDistance / 1000).toFixed(2);
        const etaMin = Math.ceil(best.summary.totalTime / 60);

        document.getElementById('distanceText').textContent = distKm + ' كم';
        document.getElementById('etaText').textContent      = etaMin + ' دقيقة';

        if (storePoints) {
            routePoints  = best.coordinates;
            currentStep  = 0;
            log('✅ مسار المرحلة ' + phase + ' – ' + distKm + ' كم – ' + routePoints.length + ' نقطة GPS', 'log-green');
        }
    });

    routeControl.on('routingerror', function() {
        log('⚠️ OSRM غير متاح – خط مستقيم كبديل', 'log-red');
        L.polyline(
            [[fromLat, fromLng], [toLat, toLng]],
            { color: lineColor, weight: 4, opacity: 0.75, dashArray: '10 8' }
        ).addTo(map);

        // build fallback points for simulation
        if (storePoints) {
            routePoints = [];
            for (let i = 0; i <= 60; i++) {
                const t = i / 60;
                routePoints.push(L.latLng(
                    fromLat + (toLat - fromLat) * t,
                    fromLng + (toLng - fromLng) * t
                ));
            }
            currentStep = 0;
            log('📍 ' + routePoints.length + ' نقطة وهمية للمحاكاة', 'log-orange');
        }
    });
}

// ============================================================
//  UPDATE STEPS UI
// ============================================================
function updateStepsUI(phase) {
    const step1  = document.getElementById('step1');
    const step2  = document.getElementById('step2');
    const step3  = document.getElementById('step3');
    const arrow1 = document.getElementById('arrow1');
    const arrow2 = document.getElementById('arrow2');

    if (phase === 1) {
        // driver moving to restaurant
        step1.className  = 'step-box active';
        step2.className  = 'step-box active';
        step3.className  = 'step-box';
        arrow1.className = 'step-arrow active';
        arrow2.className = 'step-arrow';
    } else {
        // driver moving to client
        step1.className  = 'step-box done';
        step2.className  = 'step-box done';
        step3.className  = 'step-box active';
        arrow1.className = 'step-arrow done';
        arrow2.className = 'step-arrow active';
    }
}

// ============================================================
//  UPDATE PHASE BANNER
// ============================================================
function updateBanner(phase) {
    const banner = document.getElementById('phaseBanner');
    const pText  = document.getElementById('phaseText');
    const pLabel = document.getElementById('progressLabel');
    const pBar   = document.getElementById('progressBar');

    if (phase === 1) {
        banner.className = 'phase-banner phase-to-restaurant';
        banner.innerHTML = '🏍️ المرحلة 1 – السائق في طريقه إلى المطعم لاستلام الطلب...';
        pText.textContent  = 'المرحلة 1';
        pLabel.textContent = 'تقدم المرحلة 1';
        pBar.className     = 'progress-fill progress-phase1';
    } else if (phase === 2) {
        banner.className = 'phase-banner phase-to-client';
        banner.innerHTML = '🎉 المرحلة 2 – السائق استلم طلبك وفي طريقه إليك الآن!';
        pText.textContent  = 'المرحلة 2';
        pLabel.textContent = 'تقدم المرحلة 2';
        pBar.className     = 'progress-fill progress-phase2';
    } else {
        banner.className = 'phase-banner phase-done';
        banner.innerHTML = '✅ تم التوصيل بنجاح! بصحتكم 🎉';
        pText.textContent = 'منتهي';
    }
}

// ============================================================
//  START PHASE 1  (driver → restaurant)
// ============================================================
function startPhase1() {
    if (simulationInterval) return;

    log('▶️ بدأت المرحلة 1 – السائق نحو المطعم', 'log-orange');
    currentPhase = 1;
    currentStep  = 0;
    updateBanner(1);
    updateStepsUI(1);

    // load route with storePoints = true
    drawRoute(
        TEST.driver.lat,
        TEST.driver.lng,
        TEST.restaurant.lat,
        TEST.restaurant.lng,
        1,
        true
    );

    // wait a bit for OSRM to respond then start moving
    setTimeout(function() {
        if (routePoints.length === 0) {
            log('⏳ المسار لم يُحمَّل بعد، انتظر ثانيتين...', 'log-red');
            return;
        }
        runSimulation();
    }, 2500);
}

// ============================================================
//  PHASE 2  (driver → client)  triggered automatically or manually
// ============================================================
function startPhase2() {
    stopSimulation();

    log('📦 السائق استلم الطلب! الآن نحو العميل...', 'log-green');
    currentPhase = 2;
    currentStep  = 0;
    updateBanner(2);
    updateStepsUI(2);

    // reset progress bar
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('progressPct').textContent = '0%';

    // enable pickup button feedback
    document.getElementById('btnPickup').disabled = true;

    // get current driver position
    const pos = driverMarker.getLatLng();

    // draw blue route from driver → client
    drawRoute(
        pos.lat,
        pos.lng,
        TEST.delivery.lat,
        TEST.delivery.lng,
        2,
        true
    );

    setTimeout(function() {
        if (routePoints.length === 0) {
            log('⏳ مسار المرحلة 2 لم يُحمَّل بعد...', 'log-red');
            return;
        }
        runSimulation();
    }, 2500);
}

// manual button press to simulate pickup
function manualPickup() {
    startPhase2();
}

// ============================================================
//  RUN SIMULATION – move driver step by step
// ============================================================
function runSimulation() {
    if (simulationInterval) clearInterval(simulationInterval);

    simulationInterval = setInterval(function() {
        if (currentStep >= routePoints.length) {
            // reached destination
            stopSimulation();

            if (currentPhase === 1) {
                // arrived at restaurant → auto trigger phase 2
                log('🏪 وصل السائق للمطعم! جاري الانتقال للمرحلة 2...', 'log-green');
                document.getElementById('btnPickup').disabled = false;

                // flash the pickup button
                const btn = document.getElementById('btnPickup');
                btn.style.animation = 'none';
                btn.textContent = '📦 استلم الطلب ← اضغط للمرحلة 2';

                // auto start phase 2 after 2 seconds
                setTimeout(function() {
                    startPhase2();
                }, 2000);

            } else {
                // arrived at client
                log('🎉 تم التوصيل بنجاح!', 'log-green');
                updateBanner(3);
                document.getElementById('progressBar').style.width = '100%';
                document.getElementById('progressPct').textContent = '100%';
                updateStepsUI(2);
            }
            return;
        }

        const point = routePoints[currentStep];

        // smooth move
        smoothMove(driverMarker, point.lat, point.lng);
        currentStep++;

        // update progress
        const pct = Math.round((currentStep / routePoints.length) * 100);
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressPct').textContent = pct + '%';
        document.getElementById('speedText').textContent   = '35 كم/س';

        // update remaining distance
        const totalDist = parseFloat(document.getElementById('distanceText').textContent) || 0;
        const remaining = (totalDist * (1 - currentStep / routePoints.length)).toFixed(2);
        if (!isNaN(remaining)) {
            document.getElementById('distanceText').textContent = remaining + ' كم';
        }

        // redraw route from new position every 10 steps
        if (currentStep % 10 === 0) {
            const dest = currentPhase === 1
                ? { lat: TEST.restaurant.lat, lng: TEST.restaurant.lng }
                : { lat: TEST.delivery.lat,   lng: TEST.delivery.lng   };

            drawRoute(
                point.lat, point.lng,
                dest.lat,  dest.lng,
                currentPhase,
                false   // don't overwrite routePoints
            );
        }

    }, 200);  // move every 200ms
}

// ============================================================
//  STOP SIMULATION
// ============================================================
function stopSimulation() {
    if (simulationInterval) {
        clearInterval(simulationInterval);
        simulationInterval = null;
    }
}

// ============================================================
//  RESET EVERYTHING
// ============================================================
function resetAll() {
    stopSimulation();
    currentPhase = 1;
    currentStep  = 0;
    routePoints  = [];

    // reset driver to start position
    driverMarker.setLatLng([TEST.driver.lat, TEST.driver.lng]);

    // reset UI
    updateBanner(1);
    updateStepsUI(1);
    document.getElementById('progressBar').style.width = '0%';
    document.getElementById('progressPct').textContent = '0%';
    document.getElementById('distanceText').textContent = '-- كم';
    document.getElementById('etaText').textContent      = '-- دقيقة';
    document.getElementById('speedText').textContent    = '-- كم/س';
    document.getElementById('btnPickup').disabled       = true;
    document.getElementById('btnPickup').textContent    = '📦 استلم الطلب (المرحلة 2)';

    // clear log
    document.getElementById('logBox').innerHTML =
        '<p class="log-blue">🔄 تمت إعادة التشغيل – جاهز</p>';

    // redraw phase 1 preview line
    drawRoute(
        TEST.driver.lat, TEST.driver.lng,
        TEST.restaurant.lat, TEST.restaurant.lng,
        1, false
    );

    // fit map
    map.fitBounds(L.latLngBounds([
        [TEST.driver.lat,     TEST.driver.lng],
        [TEST.restaurant.lat, TEST.restaurant.lng],
        [TEST.delivery.lat,   TEST.delivery.lng]
    ]), { padding: [50, 50] });
}

// ============================================================
//  SMOOTH MOVEMENT
// ============================================================
function smoothMove(marker, targetLat, targetLng) {
    const start  = marker.getLatLng();
    const frames = 20;
    const dLat   = (targetLat - start.lat) / frames;
    const dLng   = (targetLng - start.lng) / frames;
    let   frame  = 0;
    const tick   = setInterval(() => {
        frame++;
        marker.setLatLng([
            start.lat + dLat * frame,
            start.lng + dLng * frame
        ]);
        if (frame >= frames) clearInterval(tick);
    }, 16);
}
