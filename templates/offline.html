<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لا يوجد اتصال - توصيل DZ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --dz-green: #006633; --dz-red: #D21034; }
        * { box-sizing: border-box; }
        body {
            font-family: 'Cairo', system-ui, sans-serif;
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: #f7f9f8; color: #1a1a1a; padding: 24px; text-align: center;
        }
        .card { max-width: 380px; }
        .icon {
            width: 96px; height: 96px; margin: 0 auto 24px;
            border-radius: 28px; background: var(--dz-green);
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; color: #fff;
        }
        h1 { font-size: 1.4rem; margin: 0 0 12px; font-weight: 700; }
        p { color: #5a6b63; line-height: 1.7; margin: 0 0 28px; }
        button {
            font-family: inherit; font-size: 1rem; font-weight: 600;
            background: var(--dz-green); color: #fff; border: 0;
            padding: 13px 34px; border-radius: 12px; cursor: pointer;
        }
        button:active { transform: scale(.97); }
        .hint { margin-top: 20px; font-size: .85rem; color: #8a9a93; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>لا يوجد اتصال بالإنترنت</h1>
        <p>تعذّر تحميل المطاعم الآن. تحقق من اتصالك وأعد المحاولة.</p>
        <button onclick="location.reload()">أعد المحاولة</button>
        <div class="hint">سيعمل توصيل DZ فور عودة الاتصال</div>
    </div>
    <script>
        window.addEventListener('online', () => location.reload());
    </script>
</body>
</html>
